<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 230' width='640' height='230' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif'><rect width='640' height='230' fill='#fff'/><text x='12' y='28' font-size='16' fill='#1c1a33' text-anchor='start' font-weight='700'>Algorithme : masse en hypersignal T2 liquidien</text><path d='M24,78 L24,111.0 L38,111.0' fill='none' stroke='#c7c3dc' stroke-width='1.6'/><path d='M24,78 L24,159.0 L38,159.0' fill='none' stroke='#c7c3dc' stroke-width='1.6'/><path d='M24,78 L24,199.0 L38,199.0' fill='none' stroke='#c7c3dc' stroke-width='1.6'/><rect x='12' y='48' width='616' height='30' rx='9' fill='#4f46e5'/><text x='22' y='68' font-size='13' fill='#fff' text-anchor='start' font-weight='700'>Lésion d'allure kystique en T2 → injection systématique de gadolinium</text><rect x='38' y='88' width='590' height='46' rx='9' fill='#fff' stroke='#7c3aed' stroke-width='1.5'/><text x='48' y='108' font-size='13' fill='#1c1a33' text-anchor='start' font-weight='400'>Prise de contraste périphérique fine et régulière → kystes, chondromes, lipomes</text><text x='48' y='124' font-size='13' fill='#1c1a33' text-anchor='start' font-weight='400'>chondroïdes et myxoïdes</text><rect x='38' y='144' width='590' height='30' rx='9' fill='#fff' stroke='#7c3aed' stroke-width='1.5'/><text x='48' y='164' font-size='13' fill='#1c1a33' text-anchor='start' font-weight='400'>Paroi épaisse rehaussée, centre non rehaussé → abcès, tumeurs nécrosées</text><rect x='38' y='184' width='590' height='30' rx='9' fill='#fff' stroke='#7c3aed' stroke-width='1.5'/><text x='48' y='204' font-size='13' fill='#1c1a33' text-anchor='start' font-weight='400'>Rehaussement diffus (parfois retardé : séquences tardives !) → tumeurs myxoïdes</text></svg>