<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 838' width='640' height='838' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif'><rect width='640' height='838' fill='#fff'/><text x='12' y='28' font-size='16' fill='#1c1a33' text-anchor='start' font-weight='700'>Algorithme : masse pré-sacrée de l'adulte</text><path d='M24,78 L24,103.0 L38,103.0' fill='none' stroke='#c7c3dc' stroke-width='1.6'/><path d='M50,118 L50,151.0 L64,151.0' fill='none' stroke='#c7c3dc' stroke-width='1.6'/><path d='M24,78 L24,199.0 L38,199.0' fill='none' stroke='#c7c3dc' stroke-width='1.6'/><path d='M50,214 L50,247.0 L64,247.0' fill='none' stroke='#c7c3dc' stroke-width='1.6'/><path d='M24,78 L24,295.0 L38,295.0' fill='none' stroke='#c7c3dc' stroke-width='1.6'/><path d='M50,310 L50,343.0 L64,343.0' fill='none' stroke='#c7c3dc' stroke-width='1.6'/><path d='M24,78 L24,391.0 L38,391.0' fill='none' stroke='#c7c3dc' stroke-width='1.6'/><path d='M50,406 L50,431.0 L64,431.0' fill='none' stroke='#c7c3dc' stroke-width='1.6'/><path d='M76,446 L76,471.0 L90,471.0' fill='none' stroke='#c7c3dc' stroke-width='1.6'/><path d='M76,446 L76,511.0 L90,511.0' fill='none' stroke='#c7c3dc' stroke-width='1.6'/><path d='M76,446 L76,551.0 L90,551.0' fill='none' stroke='#c7c3dc' stroke-width='1.6'/><path d='M50,406 L50,591.0 L64,591.0' fill='none' stroke='#c7c3dc' stroke-width='1.6'/><path d='M76,606 L76,631.0 L90,631.0' fill='none' stroke='#c7c3dc' stroke-width='1.6'/><path d='M50,406 L50,671.0 L64,671.0' fill='none' stroke='#c7c3dc' stroke-width='1.6'/><path d='M76,686 L76,719.0 L90,719.0' fill='none' stroke='#c7c3dc' stroke-width='1.6'/><path d='M76,686 L76,767.0 L90,767.0' fill='none' stroke='#c7c3dc' stroke-width='1.6'/><path d='M76,686 L76,807.0 L90,807.0' fill='none' stroke='#c7c3dc' stroke-width='1.6'/><rect x='12' y='48' width='616' height='30' rx='9' fill='#4f46e5'/><text x='22' y='68' font-size='13' fill='#fff' text-anchor='start' font-weight='700'>Masse pré-sacrée de l'adulte</text><rect x='38' y='88' width='590' height='30' rx='9' fill='#7c3aed'/><text x='48' y='108' font-size='13' fill='#fff' text-anchor='start' font-weight='700'>Masse sacrée</text><rect x='64' y='128' width='564' height='46' rx='9' fill='#fff' stroke='#0d9488' stroke-width='1.5'/><text x='74' y='148' font-size='13' fill='#1c1a33' text-anchor='start' font-weight='400'>Abcès tuberculeux, métastases, hémopathies, tumeurs osseuses primitives (voir</text><text x='74' y='164' font-size='13' fill='#1c1a33' text-anchor='start' font-weight='400'>tableau)</text><rect x='38' y='184' width='590' height='30' rx='9' fill='#7c3aed'/><text x='48' y='204' font-size='13' fill='#fff' text-anchor='start' font-weight='700'>Extension foraminale</text><rect x='64' y='224' width='564' height='46' rx='9' fill='#fff' stroke='#0d9488' stroke-width='1.5'/><text x='74' y='244' font-size='13' fill='#1c1a33' text-anchor='start' font-weight='400'>Tumeurs neurogènes (schwannome, neurofibrome, ganglioneurome, épendymome</text><text x='74' y='260' font-size='13' fill='#1c1a33' text-anchor='start' font-weight='400'>myxopapillaire, paragangliome, TMGNP), méningocèle</text><rect x='38' y='280' width='590' height='30' rx='9' fill='#7c3aed'/><text x='48' y='300' font-size='13' fill='#fff' text-anchor='start' font-weight='700'>Masse rectale</text><rect x='64' y='320' width='564' height='46' rx='9' fill='#fff' stroke='#0d9488' stroke-width='1.5'/><text x='74' y='340' font-size='13' fill='#1c1a33' text-anchor='start' font-weight='400'>Abcès pré-sacré, GIST, adénocarcinome mucineux, lymphome, léiomyome /</text><text x='74' y='356' font-size='13' fill='#1c1a33' text-anchor='start' font-weight='400'>léiomyosarcome, mélanome rectal</text><rect x='38' y='376' width='590' height='30' rx='9' fill='#7c3aed'/><text x='48' y='396' font-size='13' fill='#fff' text-anchor='start' font-weight='700'>Masse pré-sacrée isolée</text><rect x='64' y='416' width='564' height='30' rx='9' fill='#0d9488'/><text x='74' y='436' font-size='13' fill='#fff' text-anchor='start' font-weight='700'>Kystique pure</text><rect x='90' y='456' width='538' height='30' rx='9' fill='#fff' stroke='#c2410c' stroke-width='1.5'/><text x='100' y='476' font-size='13' fill='#1c1a33' text-anchor='start' font-weight='400'>Uniloculaire : kyste épidermoïde, kyste dermoïde, duplication rectale</text><rect x='90' y='496' width='538' height='30' rx='9' fill='#fff' stroke='#c2410c' stroke-width='1.5'/><text x='100' y='516' font-size='13' fill='#1c1a33' text-anchor='start' font-weight='400'>Multiloculaire : tailgut cyst, kyste dermoïde</text><rect x='90' y='536' width='538' height='30' rx='9' fill='#fff' stroke='#c2410c' stroke-width='1.5'/><text x='100' y='556' font-size='13' fill='#1c1a33' text-anchor='start' font-weight='400'>Graisse : tératome</text><rect x='64' y='576' width='564' height='30' rx='9' fill='#0d9488'/><text x='74' y='596' font-size='13' fill='#fff' text-anchor='start' font-weight='700'>Mixte (portion solide)</text><rect x='90' y='616' width='538' height='30' rx='9' fill='#fff' stroke='#c2410c' stroke-width='1.5'/><text x='100' y='636' font-size='13' fill='#1c1a33' text-anchor='start' font-weight='400'>Tératocarcinome, dégénérescence d'un tailgut cyst (limites irrégulières)</text><rect x='64' y='656' width='564' height='30' rx='9' fill='#0d9488'/><text x='74' y='676' font-size='13' fill='#fff' text-anchor='start' font-weight='700'>Tissulaire</text><rect x='90' y='696' width='538' height='46' rx='9' fill='#fff' stroke='#c2410c' stroke-width='1.5'/><text x='100' y='716' font-size='13' fill='#1c1a33' text-anchor='start' font-weight='400'>Contenant de la graisse : hématopoïèse extra-médullaire, myélolipome,</text><text x='100' y='732' font-size='13' fill='#1c1a33' text-anchor='start' font-weight='400'>lipome / liposarcome</text><rect x='90' y='752' width='538' height='30' rx='9' fill='#fff' stroke='#c2410c' stroke-width='1.5'/><text x='100' y='772' font-size='13' fill='#1c1a33' text-anchor='start' font-weight='400'>Hypervasculaire : tumeur fibreuse solitaire</text><rect x='90' y='792' width='538' height='30' rx='9' fill='#fff' stroke='#c2410c' stroke-width='1.5'/><text x='100' y='812' font-size='13' fill='#1c1a33' text-anchor='start' font-weight='400'>Autres : hématome, tumeur desmoïde, maladie de Castleman, sarcomes</text></svg>