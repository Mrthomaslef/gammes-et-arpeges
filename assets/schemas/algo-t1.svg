<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 486' width='640' height='486' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif'><rect width='640' height='486' fill='#fff'/><text x='12' y='28' font-size='16' fill='#1c1a33' text-anchor='start' font-weight='700'>Algorithme : masse en hypersignal T1</text><path d='M24,94 L24,119.0 L38,119.0' fill='none' stroke='#c7c3dc' stroke-width='1.6'/><path d='M50,134 L50,167.0 L64,167.0' fill='none' stroke='#c7c3dc' stroke-width='1.6'/><path d='M50,134 L50,215.0 L64,215.0' fill='none' stroke='#c7c3dc' stroke-width='1.6'/><path d='M50,134 L50,255.0 L64,255.0' fill='none' stroke='#c7c3dc' stroke-width='1.6'/><path d='M24,94 L24,295.0 L38,295.0' fill='none' stroke='#c7c3dc' stroke-width='1.6'/><path d='M50,310 L50,335.0 L64,335.0' fill='none' stroke='#c7c3dc' stroke-width='1.6'/><path d='M50,310 L50,375.0 L64,375.0' fill='none' stroke='#c7c3dc' stroke-width='1.6'/><path d='M50,310 L50,415.0 L64,415.0' fill='none' stroke='#c7c3dc' stroke-width='1.6'/><path d='M50,310 L50,455.0 L64,455.0' fill='none' stroke='#c7c3dc' stroke-width='1.6'/><rect x='12' y='48' width='616' height='46' rx='9' fill='#4f46e5'/><text x='22' y='68' font-size='13' fill='#fff' text-anchor='start' font-weight='700'>Masse des tissus mous en hypersignal T1 : disparaît après suppression du signal de la</text><text x='22' y='84' font-size='13' fill='#fff' text-anchor='start' font-weight='700'>graisse ?</text><rect x='38' y='104' width='590' height='30' rx='9' fill='#7c3aed'/><text x='48' y='124' font-size='13' fill='#fff' text-anchor='start' font-weight='700'>OUI — contient de la graisse</text><rect x='64' y='144' width='564' height='46' rx='9' fill='#fff' stroke='#0d9488' stroke-width='1.5'/><text x='74' y='164' font-size='13' fill='#1c1a33' text-anchor='start' font-weight='400'>Sans calcification : lipomes et liposarcomes, malformations vasculaires,</text><text x='74' y='180' font-size='13' fill='#1c1a33' text-anchor='start' font-weight='400'>hémangiomes…</text><rect x='64' y='200' width='564' height='30' rx='9' fill='#fff' stroke='#0d9488' stroke-width='1.5'/><text x='74' y='220' font-size='13' fill='#1c1a33' text-anchor='start' font-weight='400'>Avec calcifications : malformations vasculaires (phlébolithes)</text><rect x='64' y='240' width='564' height='30' rx='9' fill='#fff' stroke='#0d9488' stroke-width='1.5'/><text x='74' y='260' font-size='13' fill='#1c1a33' text-anchor='start' font-weight='400'>Os mature (moelle graisseuse) : myosite ossifiante mature, ostéochondromatose</text><rect x='38' y='280' width='590' height='30' rx='9' fill='#7c3aed'/><text x='48' y='300' font-size='13' fill='#fff' text-anchor='start' font-weight='700'>NON — pas de graisse</text><rect x='64' y='320' width='564' height='30' rx='9' fill='#fff' stroke='#0d9488' stroke-width='1.5'/><text x='74' y='340' font-size='13' fill='#1c1a33' text-anchor='start' font-weight='400'>Méthémoglobine : hématome, tumeurs hémorragiques</text><rect x='64' y='360' width='564' height='30' rx='9' fill='#fff' stroke='#0d9488' stroke-width='1.5'/><text x='74' y='380' font-size='13' fill='#1c1a33' text-anchor='start' font-weight='400'>Vaisseaux à flux lent : malformations veineuses, hémangiome</text><rect x='64' y='400' width='564' height='30' rx='9' fill='#fff' stroke='#0d9488' stroke-width='1.5'/><text x='74' y='420' font-size='13' fill='#1c1a33' text-anchor='start' font-weight='400'>Matériel protéique : kystes mucoïdes, abcès</text><rect x='64' y='440' width='564' height='30' rx='9' fill='#fff' stroke='#0d9488' stroke-width='1.5'/><text x='74' y='460' font-size='13' fill='#1c1a33' text-anchor='start' font-weight='400'>Mélanine : mélanome, sarcome à cellules claires</text></svg>