<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 526' width='640' height='526' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif'><rect width='640' height='526' fill='#fff'/><text x='12' y='28' font-size='16' fill='#1c1a33' text-anchor='start' font-weight='700'>Algorithme : masse pré-sacrée de l'enfant</text><path d='M24,78 L24,103.0 L38,103.0' fill='none' stroke='#c7c3dc' stroke-width='1.6'/><path d='M50,118 L50,143.0 L64,143.0' fill='none' stroke='#c7c3dc' stroke-width='1.6'/><path d='M24,78 L24,183.0 L38,183.0' fill='none' stroke='#c7c3dc' stroke-width='1.6'/><path d='M50,198 L50,223.0 L64,223.0' fill='none' stroke='#c7c3dc' stroke-width='1.6'/><path d='M50,198 L50,271.0 L64,271.0' fill='none' stroke='#c7c3dc' stroke-width='1.6'/><path d='M24,78 L24,319.0 L38,319.0' fill='none' stroke='#c7c3dc' stroke-width='1.6'/><path d='M50,334 L50,367.0 L64,367.0' fill='none' stroke='#c7c3dc' stroke-width='1.6'/><path d='M50,334 L50,415.0 L64,415.0' fill='none' stroke='#c7c3dc' stroke-width='1.6'/><path d='M24,78 L24,455.0 L38,455.0' fill='none' stroke='#c7c3dc' stroke-width='1.6'/><path d='M50,470 L50,495.0 L64,495.0' fill='none' stroke='#c7c3dc' stroke-width='1.6'/><rect x='12' y='48' width='616' height='30' rx='9' fill='#4f46e5'/><text x='22' y='68' font-size='13' fill='#fff' text-anchor='start' font-weight='700'>Masse pré-sacrée de l'enfant</text><rect x='38' y='88' width='590' height='30' rx='9' fill='#7c3aed'/><text x='48' y='108' font-size='13' fill='#fff' text-anchor='start' font-weight='700'>Ostéolyse sacrée</text><rect x='64' y='128' width='564' height='30' rx='9' fill='#fff' stroke='#0d9488' stroke-width='1.5'/><text x='74' y='148' font-size='13' fill='#1c1a33' text-anchor='start' font-weight='400'>Sarcome d'Ewing (&gt; 5 ans), lymphome, métastase</text><rect x='38' y='168' width='590' height='30' rx='9' fill='#7c3aed'/><text x='48' y='188' font-size='13' fill='#fff' text-anchor='start' font-weight='700'>Extension intra-canalaire</text><rect x='64' y='208' width='564' height='30' rx='9' fill='#fff' stroke='#0d9488' stroke-width='1.5'/><text x='74' y='228' font-size='13' fill='#1c1a33' text-anchor='start' font-weight='400'>Débute dans le canal : TMGNP (hétérogène)</text><rect x='64' y='248' width='564' height='46' rx='9' fill='#fff' stroke='#0d9488' stroke-width='1.5'/><text x='74' y='268' font-size='13' fill='#1c1a33' text-anchor='start' font-weight='400'>En sablier : tumeurs neuroblastiques — hétérogène &lt; 2 ans : neuroblastome ;</text><text x='74' y='284' font-size='13' fill='#1c1a33' text-anchor='start' font-weight='400'>homogène &gt; 10 ans : ganglioneurome ; ganglioneuroblastome entre les deux</text><rect x='38' y='304' width='590' height='30' rx='9' fill='#7c3aed'/><text x='48' y='324' font-size='13' fill='#fff' text-anchor='start' font-weight='700'>Isolée — selon la composition</text><rect x='64' y='344' width='564' height='46' rx='9' fill='#fff' stroke='#0d9488' stroke-width='1.5'/><text x='74' y='364' font-size='13' fill='#1c1a33' text-anchor='start' font-weight='400'>Calcifications / graisse : tumeurs germinales, tératome sacro-coccygien (&lt; 3</text><text x='74' y='380' font-size='13' fill='#1c1a33' text-anchor='start' font-weight='400'>mois ; plus c'est tissulaire, plus c'est malin)</text><rect x='64' y='400' width='564' height='30' rx='9' fill='#fff' stroke='#0d9488' stroke-width='1.5'/><text x='74' y='420' font-size='13' fill='#1c1a33' text-anchor='start' font-weight='400'>Kystique : lymphangiome kystique</text><rect x='38' y='440' width='590' height='30' rx='9' fill='#7c3aed'/><text x='48' y='460' font-size='13' fill='#fff' text-anchor='start' font-weight='700'>Masse uro-génitale à extension pré-sacrée</text><rect x='64' y='480' width='564' height='30' rx='9' fill='#fff' stroke='#0d9488' stroke-width='1.5'/><text x='74' y='500' font-size='13' fill='#1c1a33' text-anchor='start' font-weight='400'>Rhabdomyosarcome (hétérogène, infiltrant, adénopathies)</text></svg>